<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5E6C8"/>
      <stop offset="1" stop-color="#E2C79C"/>
    </linearGradient>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0.2"/>
      <feBlend mode="soft-light"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <g filter="url(#noise)" opacity="0.18">
    <rect width="100%" height="100%" fill="#000"/>
  </g>
  <!-- Compass -->
  <g transform="translate(70,100)">
    <circle r="56" fill="none" stroke="#2E4E3F" stroke-width="4"/>
    <g transform="rotate(-20)">
      <polygon points="0,-44 6,-20 0,0 -6,-20" fill="#A4572B"/>
      <polygon points="0,44 -6,20 0,0 6,20" fill="#6B4F2D"/>
    </g>
    <circle r="6" fill="#2E4E3F"/>
  </g>
  <!-- Wordmark -->
  <g font-family="Georgia, 'Times New Roman', Times, serif" font-weight="700" fill="#2E4E3F">
    <text x="150" y="96" font-size="72" letter-spacing="1.5">Dig</text>
    <text x="150" y="156" font-size="72" letter-spacing="1.5">Funding</text>
  </g>
  <g fill="#6B4F2D" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="18">
    <text x="152" y="182">Explorer-funded archaeology</text>
  </g>
</svg>
