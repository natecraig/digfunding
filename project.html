<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dig Funding — Project</title>
  <meta name="description" content="Project details — Dig Funding" />
  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">
        <img src="assets/logo.svg" alt="Dig Funding logo" width="160" height="44"/>
      </a>
      <nav class="nav">
        <a href="index.html">Explore</a>
        <a href="create.html">Create a Project</a>
        <a href="#" id="my-backing-link">My Backing</a>
      </nav>
    </div>
  </header>

  <main class="wrap project-detail">
    <div class="meta">
      <a class="back" href="index.html"><img src="assets/icons/arrow.svg" alt="" width="18" height="18"/> Back to projects</a>
    </div>

    <article id="project">
      <header class="project-hero">
        <img id="coverImage" src="" alt="Project cover" class="cover"/>
        <div class="titlebox">
          <h1 id="title"></h1>
          <p id="subtitle" class="muted"></p>
        </div>
      </header>

      <section class="project-body">
        <aside class="project-sidebar">
          <div class="profile">
            <img id="profileImage" class="avatar" alt="Lead researcher profile"/>
            <div>
              <div id="leadResearcher" class="lead"></div>
              <div id="organization" class="org muted"></div>
            </div>
          </div>

          <div class="funding">
            <div class="progress-row">
              <div class="progress">
                <div id="progressBar" class="bar" style="width:0%"></div>
              </div>
              <div class="progress-meta">
                <div><strong id="amountRaised"></strong> raised</div>
                <div>of <strong id="fundingGoal"></strong> goal</div>
              </div>
            </div>
            <button id="backBtn" class="btn">Back this project</button>
            <p id="daysLeft" class="small muted"></p>
          </div>

          <div class="rewards">
            <h3>Rewards</h3>
            <div id="rewardsList"></div>
          </div>
        </aside>

        <div class="project-content">
          <div id="fullDescription" class="prose"></div>
          <div class="tags" id="tags"></div>
          <div class="facts">
            <div><img src="assets/icons/pin.svg" alt="" width="16" height="16"/> <span id="location"></span></div>
            <div><img src="assets/icons/calendar.svg" alt="" width="16" height="16"/> <span id="dates"></span></div>
          </div>

          <hr/>

          <section class="updates">
            <h2>Updates & Exclusive Content</h2>
            <div id="updates"></div>
            <div id="lockHint" class="hint hidden"><img src="assets/icons/lock.svg" alt="" width="16" height="16"/> Back this project to unlock exclusive posts.</div>
          </section>
        </div>
      </section>
    </article>
  </main>

  <div id="pledgeModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pledgeTitle">
    <div class="modal-content">
      <button class="modal-close" id="closeModal" aria-label="Close">×</button>
      <h3 id="pledgeTitle">Choose your reward</h3>
      <div id="pledgeLevels" class="pledge-levels"></div>
      <div class="pledge-actions">
        <label for="customAmount" class="muted">Or enter custom amount (USD)</label>
        <input id="customAmount" type="number" min="1" step="1" placeholder="50"/>
        <button id="confirmPledge" class="btn">Confirm Pledge</button>
      </div>
      <p class="small muted">Demo: your pledge is stored in your browser only (local on this device).</p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <div class="left">
        <img src="assets/logo.svg" alt="" width="120" height="33"/>
        <p class="small">© <span id="year"></span> Dig Funding</p>
      </div>
      <div class="right">
        <a href="LICENSE" class="small">MIT License</a>
        <a href="README.md" class="small">Docs</a>
      </div>
    </div>
  </footer>

  <script src="scripts/project.js"></script>
</body>
</html>
